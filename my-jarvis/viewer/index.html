<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis · Knowledge Galaxy</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; color: #e8e4f5; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
  #graph { position: fixed; inset: 0; }
  #stars { position: fixed; inset: 0; pointer-events: none; }
  #panel { position: fixed; top: 0; right: -380px; width: 360px; max-width: 90vw; height: 100%; background: rgba(12,10,24,.94); border-left: 1px solid #2c2547; padding: 20px; overflow-y: auto; transition: right .35s ease; z-index: 5; }
  #panel.open { right: 0; }
  #panel h2 { font-size: 17px; color: #c9b8f5; margin-bottom: 4px; }
  #panel .grp { font-size: 12px; color: #8a849a; margin-bottom: 10px; }
  #panel .ex { font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
  #panel button { margin-top: 14px; background: #2c2547; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  #bar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(680px, 92vw); z-index: 6; }
  #status { font-size: 12px; color: #8a849a; margin-bottom: 6px; text-align: center; min-height: 16px; }
  #askrow { display: flex; gap: 8px; }
  #q { flex: 1; background: rgba(20,16,38,.92); color: #fff; border: 1px solid #3a3160; border-radius: 10px; padding: 11px 14px; font-size: 14px; }
  #ask { background: #7c6aa8; color: #fff; border: 0; border-radius: 10px; padding: 0 20px; font-size: 14px; cursor: pointer; }
  #answer { margin-top: 8px; background: rgba(20,16,38,.92); border: 1px solid #2c2547; border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 1.6; display: none; max-height: 30vh; overflow-y: auto; }
  #count { position: fixed; top: 12px; left: 14px; font-size: 12.5px; color: #8a849a; z-index: 6; background: rgba(10,8,20,.7); padding: 6px 12px; border-radius: 999px; border: 1px solid #2c2547; }
</style></head><body>
<canvas id="stars"></canvas>
<div id="graph"></div>
<div id="count">… notes</div>
<aside id="panel"><h2 id="pTitle"></h2><div class="grp" id="pGroup"></div><div class="ex" id="pEx"></div><button onclick="closePanel()">Close</button></aside>
<div id="bar">
  <div id="status"></div>
  <div id="askrow"><input id="q" placeholder="Ask your notes…" autocomplete="off"><button id="ask" onclick="askJarvis()">Ask</button></div>
  <div id="answer"></div>
</div>
<script src="graph-data.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.80.1/dist/3d-force-graph.min.js"></script>
<script>
'use strict';
const MUTE = location.search.indexOf('mute=1') !== -1;
const statusEl = document.getElementById('status');
const answerEl = document.getElementById('answer');
const panel = document.getElementById('panel');
const G = (typeof GRAPH !== 'undefined' && GRAPH.nodes) ? GRAPH : { nodes: [], links: [] };
document.getElementById('count').textContent = G.nodes.length + ' notes indexed';

// starfield
(function () {
  const c = document.getElementById('stars'), x = c.getContext('2d');
  function size() { c.width = innerWidth; c.height = innerHeight; }
  size(); addEventListener('resize', size);
  const stars = Array.from({ length: 350 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + .2, t: Math.random() * 6.28 }));
  (function draw() {
    x.clearRect(0, 0, c.width, c.height);
    for (const s of stars) { s.t += .01; x.globalAlpha = .35 + .35 * Math.sin(s.t); x.fillStyle = '#cfd4ff'; x.beginPath(); x.arc(s.x * c.width, s.y * c.height, s.r, 0, 6.29); x.fill(); }
    x.globalAlpha = 1;
    requestAnimationFrame(draw);
  })();
})();

const GROUP_COLORS = {};
const PALETTE = ['#a78bdb', '#6ee7b7', '#f9a8d4', '#93c5fd', '#fcd34d', '#fca5a5', '#5eead4'];
function colorOf(g) {
  if (!(g in GROUP_COLORS)) GROUP_COLORS[g] = PALETTE[Object.keys(GROUP_COLORS).length % PALETTE.length];
  return GROUP_COLORS[g];
}

const Graph = ForceGraph3D()(document.getElementById('graph'))
  .graphData(G)
  .nodeLabel(n => n.label)
  .nodeColor(n => colorOf(n.group))
  .nodeRelSize(5)
  .backgroundColor('rgba(0,0,0,0)')
  .showNavInfo(false)
  .onNodeClick(focusSingle);
Graph.controls().autoRotate = true;
Graph.controls().autoRotateSpeed = 0.5;

function litSet(centerIds) {
  const keep = new Set(centerIds);
  for (const l of G.links) {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (keep.has(s)) keep.add(t);
    if (keep.has(t)) keep.add(s);
  }
  return keep;
}
function applyLit(keep) {
  Graph.nodeColor(n => keep.has(n.id) ? colorOf(n.group) : 'rgba(90,85,120,0.25)');
  Graph.linkWidth(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return (keep.has(s) && keep.has(t)) ? 1.2 : 0.1;
  });
}
function openPanel(n) {
  document.getElementById('pTitle').textContent = n.label;
  document.getElementById('pGroup').textContent = n.group + ' · node #' + n.id;
  document.getElementById('pEx').textContent = n.excerpt || '';
  panel.classList.add('open');
}
function closePanel() { panel.classList.remove('open'); }

// ONE OWNER FOR FOCUS: only the answer path moves the camera.
function focusSingle(node) {
  const keep = litSet([node.id]);
  applyLit(keep);
  const d = 140, r = Math.hypot(node.x || 1, node.y || 1, node.z || 1) || 1;
  Graph.cameraPosition({ x: (node.x || 0) / r * d, y: (node.y || 0) / r * d, z: (node.z || 0) / r * d }, node, 1200);
  openPanel(node);
}
function focusNodes(ids) {
  if (!ids || !ids.length) return;
  const nodes = ids.map(i => G.nodes[i]).filter(Boolean);
  if (!nodes.length) return;
  if (nodes.length >= 4) { applyLit(litSet(nodes.map(n => n.id))); return; } // cluster: light, don't fly
  focusSingle(nodes[0]);
}

function speak(text) {
  if (MUTE) return; // the one speak function refuses under ?mute=1
  try {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text.slice(0, 220));
    const vs = speechSynthesis.getVoices();
    const en = vs.filter(v => v.lang && v.lang.toLowerCase().indexOf('en-gb') === 0);
    if (en.length) u.voice = en[0];
    speechSynthesis.speak(u);
  } catch (e) { /* voice is best-effort in P01 */ }
}

let lastQid = null, pollTimer = null;
async function askJarvis(preset) {
  const input = document.getElementById('q');
  const text = (preset !== undefined ? preset : input.value).trim();
  if (!text) return;
  statusEl.textContent = '● thinking…';
  answerEl.style.display = 'block';
  answerEl.textContent = '…';
  let data;
  try {
    const r = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: text }) });
    data = await r.json();
  } catch (e) { statusEl.textContent = ''; answerEl.textContent = 'Server unreachable. Is server.py running?'; return; }
  statusEl.textContent = '';
  answerEl.textContent = data.answer || '(no answer)';
  lastQid = data.qid || null;
  if (data.nodes) focusNodes(data.nodes);
  if (data.spoken) speak(data.spoken);
  if (lastQid) { clearInterval(pollTimer); pollTimer = setInterval(pollLive, 2500); }
}
async function pollLive() {
  if (lastQid == null) return;
  try {
    const r = await fetch('/bridge/outbox?qid=' + encodeURIComponent(lastQid));
    const d = await r.json();
    if (d && d.answer) {
      answerEl.textContent = d.answer;
      speak(d.answer);
      clearInterval(pollTimer); lastQid = null;
    }
  } catch (e) { /* keep extractive answer */ }
}
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') askJarvis(); });
</script></body></html>
